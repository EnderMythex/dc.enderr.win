[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
dc-core = { path = "crates/core" }

anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.10", features = ["cookie", "form"] }
bollard = "0.21"
dotenvy = "0.15"
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
maud = { version = "0.27", features = ["axum"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

# Tuned for fast deploys: no link-time optimization (minutes saved, the bots
# do not need the last percent of speed) and incremental builds, kept in the
# Docker build cache (see Dockerfile).
[profile.release]
lto = false
incremental = true
strip = true
